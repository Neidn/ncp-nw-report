[project]
name = "ncp-nw-report"
version = "0.1.0"
description = "NCP 접근통제 정책(ACG/NACL/Subnet) 별첨 엑셀 생성기 — 네트워크 구성도 현행화용"
requires-python = ">=3.9"
dependencies = [
    "ncp-api-python @ git+https://github.com/Neidn/ncp-api-python@v0.12.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
ncp-nw-report = "ncp_nw_report.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ncp_nw_report"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
